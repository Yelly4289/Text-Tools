<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090c12">
<title>Text Tools — Case Converter &amp; URL Codec</title>
<style>
:root{color-scheme:dark;--bg:#090c12;--panel:#131820;--panel2:#0b1017;--line:#252d38;--text:#edf2fa;--muted:#98a6ba;--accent:#c8d5ee;--blue:#82b4ff;--good:#79d7b0;--bad:#ff9b9b;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}button,input,textarea{font:inherit}button{color:inherit}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,44px);position:sticky;top:0;background:#090c12ed;backdrop-filter:blur(12px);z-index:2}.brand{font-weight:750;letter-spacing:-.04em;display:flex;gap:10px;align-items:center}.brand-icon{color:var(--blue);font-size:19px}.top-actions{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.shortcut{border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--text);font-family:ui-monospace,monospace}.icon-btn,.btn,.tab{border:1px solid var(--line);background:transparent;border-radius:9px;padding:8px 13px;cursor:pointer;transition:.15s}.icon-btn{padding:7px 9px}.icon-btn:hover,.btn:hover,.tab:hover{border-color:#56657a;background:#19212c}.shell{max-width:1080px;margin:0 auto;padding:42px 24px 76px}.hero{margin-bottom:27px}.hero h1{font-size:28px;letter-spacing:-.04em;margin:0 0 6px}.hero p,.section-note{color:var(--muted);margin:0}.heading-icon{color:var(--blue);margin-right:9px}.nav{display:flex;gap:8px;margin-bottom:28px}.tab.active{background:var(--accent);border-color:var(--accent);color:#101722;font-weight:650}.panel{display:none}.panel.active{display:block}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 10px}.section-head h2{font-size:15px;margin:0}.label{display:block;font-weight:650;margin-bottom:8px}.field{width:100%;min-height:126px;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--text);padding:14px;outline:none;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px;line-height:1.65}.field:focus,.single-input:focus{border-color:#7295c7;box-shadow:0 0 0 3px #5f8fd51f}.input-wrap{margin-bottom:24px}.group{margin-top:22px}.group-title{font-size:15px;margin:0 0 2px}.group-note{margin:0 0 10px;color:var(--muted);font-size:13px}.rows{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.row{display:grid;grid-template-columns:190px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 13px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-name{font-size:13px;font-weight:650}.row-desc{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}.result{min-width:0;width:100%;padding:9px 11px;background:var(--panel2);border:1px solid transparent;border-radius:8px;color:#e7eef9;white-space:nowrap;overflow:auto;font:13px ui-monospace,SFMono-Regular,Consolas,monospace}.result.empty{color:#657286}.copy-btn{min-width:62px;padding:8px 10px;font-size:12px}.copy-btn:disabled{opacity:.48;cursor:not-allowed}.copy-btn.copied{border-color:#327658;color:var(--good)}.mode-switch{display:inline-flex;gap:8px;margin:0 0 20px}.url-area{margin-bottom:13px}.url-area .field{min-height:150px}.options{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:10px 0 22px}.check{accent-color:#9bb7e6;width:15px;height:15px}.result-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px;margin-top:18px}.result-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.result-top h2{font-size:14px;margin:0}.url-output{min-height:74px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--blue);font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.status{font-size:13px;margin:10px 0 0}.status.error{color:var(--bad)}.status.ok{color:var(--good)}.params{margin-top:18px}.param-row{display:grid;grid-template-columns:minmax(100px,.7fr) minmax(0,1.3fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}.param-key{color:var(--blue);overflow-wrap:anywhere}.param-value{overflow-wrap:anywhere;color:var(--muted)}.empty-state{color:var(--muted);font-size:13px}.footer{border-top:1px solid var(--line);text-align:center;padding:19px;color:var(--muted);font-size:12px}.footer strong{color:#c7d3e6}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);padding:9px 14px;border:1px solid var(--line);background:#18212d;border-radius:9px;color:var(--text);opacity:0;transition:.2s;pointer-events:none;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}[hidden]{display:none!important}@media(max-width:650px){.shell{padding:29px 16px 54px}.hero h1{font-size:24px}.row{grid-template-columns:minmax(0,1fr) auto;gap:8px}.row-meta{grid-column:1/-1}.result{grid-column:1;grid-row:2}.copy-btn{grid-column:2;grid-row:2}.top-actions .palette-hint{display:none}.row-desc{max-width:42ch}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="#case-converter" aria-label="Text Tools home"><span class="brand-icon">Aa</span><span>Text Tools</span></a><div class="top-actions"><span class="palette-hint">Switch tools</span><span class="shortcut">C&nbsp; / &nbsp;U</span></div></header>
<main class="shell">
<header class="hero"><h1>Text tools</h1><p>Choose a tool to get started.</p></header>
<nav class="nav" aria-label="Tools"><button class="tab active" id="case-tab" type="button" role="tab" aria-selected="true">Aa&nbsp; Case Converter</button><button class="tab" id="url-tab" type="button" role="tab" aria-selected="false">↗&nbsp; URL Codec</button></nav>
<section class="panel active" id="case-panel" role="tabpanel" aria-labelledby="case-tab"><div class="section-head"><div><h2>Text to convert</h2><p class="section-note">Paste text once, then copy the format that fits.</p></div><button class="btn" id="clear-case" type="button">Clear</button></div><div class="input-wrap"><label class="label" for="case-input">Input text</label><textarea class="field" id="case-input" placeholder="e.g. the quick brown fox jumps over the lazy dog" spellcheck="false"></textarea></div><div id="case-groups"></div></section>
<section class="panel" id="url-panel" role="tabpanel" aria-labelledby="url-tab"><div class="section-head"><div><h2>URL Codec</h2><p class="section-note">Encode or decode a URL and inspect its query parameters.</p></div><button class="btn" id="clear-url" type="button">Clear</button></div><div class="mode-switch" role="group" aria-label="URL operation"><button class="tab active" id="decode-mode" type="button" aria-pressed="true">Decode</button><button class="tab" id="encode-mode" type="button" aria-pressed="false">Encode</button></div><div class="url-area"><label class="label" id="url-label" for="url-input">Encoded URL</label><textarea class="field" id="url-input" placeholder="https://example.com/path/%E0%B8%84?q=%E0%B8%99" spellcheck="false"></textarea></div><div class="options" id="decode-options"><label><input class="check" id="plus-space" type="checkbox"> Treat <code>+</code> as space (form encoding)</label></div><div class="options" id="encode-options" hidden><label><input class="check" id="encode-plus" type="checkbox"> Encode spaces as <code>+</code> (form encoding)</label><label><input class="check" id="encode-component" type="checkbox"> Encode entire URL as a component</label></div><p class="status" id="url-status" aria-live="polite"></p><section class="result-card" id="url-result" hidden><div class="result-top"><h2 id="url-output-title">Decoded URL</h2><button class="btn copy-btn" id="copy-url" type="button">Copy</button></div><div class="url-output" id="url-output"></div><div class="params" id="url-params" hidden><div class="section-head"><h2>Query parameters</h2></div><div id="param-list"></div></div></section></section>
</main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), caseInput=$('#case-input'), urlInput=$('#url-input');
const groups=[{title:'Code styles',note:'Common in identifiers, URLs, and code-facing strings.',items:[['camelCase','Common in JavaScript variables and object keys.',t=>toWords(t).map((w,i)=>i?cap(w):w.toLowerCase()).join('')],['PascalCase','Useful for components and class names.',t=>toWords(t).map(cap).join('')],['snake_case','Common in Python names and database fields.',t=>toWords(t).map(w=>w.toLowerCase()).join('_')],['kebab-case','Good for URLs, file names, and CSS-friendly strings.',t=>toWords(t).map(w=>w.toLowerCase()).join('-')],['CONSTANT_CASE','Often used for constants and enum-like keys.',t=>toWords(t).map(w=>w.toUpperCase()).join('_')]]},{title:'Readable',note:'Better for prose, headings, and copy decks.',items:[['Title Case','A natural fit for headings and labels.',titleCase],['Sentence case','Reads naturally in UI copy and prose.',sentenceCase],['lowercase','Keeps text normalized and understated.',t=>t.toLocaleLowerCase()],['UPPERCASE','Adds emphasis for legacy labels or loud states.',t=>t.toLocaleUpperCase()]]},{title:'Other transforms',note:'Handy when you need a literal match for niche tools.',items:[['dot.case','Works for namespaced keys and niche slug formats.',t=>toWords(t).map(w=>w.toLowerCase()).join('.')]]}];
function toWords(s){let x=s.normalize('NFKC');x=x.replace(/([\p{Ll}\d])([\p{Lu}])/gu,'$1 $2').replace(/([\p{Lu}]+)([\p{Lu}][\p{Ll}])/gu,'$1 $2');return x.match(/[\p{L}\p{N}]+/gu)||[]}
function cap(s){return s?s[0].toLocaleUpperCase()+s.slice(1).toLocaleLowerCase():s}
function titleCase(t){return t.toLocaleLowerCase().replace(/(^|[^\p{L}\p{N}])([\p{L}\p{N}])/gu,(_,a,b)=>a+b.toLocaleUpperCase())}
function sentenceCase(t){const x=t.toLocaleLowerCase();return x.replace(/(^\s*[\p{L}]|[.!?]\s+[\p{L}])/gu,m=>m.toLocaleUpperCase())}
const host=$('#case-groups');groups.forEach(g=>{const section=document.createElement('section');section.className='group';const h=document.createElement('h2');h.className='group-title';h.textContent=g.title;const note=document.createElement('p');note.className='group-note';note.textContent=g.note;const rows=document.createElement('div');rows.className='rows';g.items.forEach(([name,desc,fn])=>{const row=document.createElement('div');row.className='row';const meta=document.createElement('div');meta.className='row-meta';const n=document.createElement('div');n.className='row-name';n.textContent=name;const d=document.createElement('div');d.className='row-desc';d.textContent=desc;meta.append(n,d);const out=document.createElement('output');out.className='result empty';out.dataset.transform=name;out.textContent='—';const btn=document.createElement('button');btn.className='btn copy-btn';btn.type='button';btn.textContent='Copy';btn.disabled=true;btn.addEventListener('click',()=>copyText(out.textContent,btn));row.append(meta,out,btn);rows.append(row)});section.append(h,note,rows);host.append(section)});
function renderCases(){host.querySelectorAll('.row').forEach(row=>{const out=row.querySelector('.result'),btn=row.querySelector('button'),fn=groups.flatMap(g=>g.items).find(x=>x[0]===out.dataset.transform)?.[2],v=caseInput.value;out.textContent=v?fn(v):'—';out.classList.toggle('empty',!v);btn.disabled=!v;btn.classList.remove('copied');btn.textContent='Copy'})}caseInput.addEventListener('input',renderCases);$('#clear-case').addEventListener('click',()=>{caseInput.value='';renderCases();caseInput.focus()});
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1500)}
async function copyText(text,btn){try{await navigator.clipboard.writeText(text);if(btn){btn.textContent='Copied';btn.classList.add('copied');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied')},1300)}else toast('Copied to clipboard')}catch{toast('Clipboard unavailable — select and copy the result')}}
function setMode(mode){const decode=mode==='decode';$('#decode-mode').classList.toggle('active',decode);$('#encode-mode').classList.toggle('active',!decode);$('#decode-mode').setAttribute('aria-pressed',decode);$('#encode-mode').setAttribute('aria-pressed',!decode);$('#url-label').textContent=decode?'Encoded URL':'Plain URL';$('#decode-options').hidden=!decode;$('#encode-options').hidden=decode;$('#url-output-title').textContent=decode?'Decoded URL':'Encoded URL';updateUrl()}
$('#decode-mode').addEventListener('click',()=>setMode('decode'));$('#encode-mode').addEventListener('click',()=>setMode('encode'));[urlInput,$('#plus-space'),$('#encode-plus'),$('#encode-component')].forEach(el=>el.addEventListener('input',updateUrl));$('#clear-url').addEventListener('click',()=>{urlInput.value='';updateUrl();urlInput.focus()});$('#copy-url').addEventListener('click',()=>copyText($('#url-output').textContent));
function updateUrl(){const raw=urlInput.value,decode=$('#decode-mode').getAttribute('aria-pressed')==='true',card=$('#url-result'),status=$('#url-status');status.textContent='';status.className='status';if(!raw.trim()){card.hidden=true;return}try{let result;if(decode){const s=$('#plus-space').checked?raw.replace(/\+/g,' '):raw;result=decodeURI(s);if($('#plus-space').checked){try{result=new URL(result,'https://local.invalid').href.replace('https://local.invalid','')}catch{}}}else if($('#encode-component').checked){result=encodeURIComponent(raw)}else{result=encodeURI(raw);if($('#encode-plus').checked)result=result.replace(/%20/g,'+')}
$('#url-output').textContent=result;card.hidden=false;status.textContent='Valid';status.classList.add('ok');renderParams(result,decode)}catch(e){card.hidden=true;status.textContent='Invalid URL encoding: '+(e instanceof URIError?'malformed percent escape or invalid UTF-8':'could not process input');status.classList.add('error')}}
function renderParams(text,decode){const wrap=$('#url-params'),list=$('#param-list');list.replaceChildren();try{const u=new URL(text,'https://local.invalid'),entries=[...u.searchParams.entries()];if(!entries.length){wrap.hidden=true;return}wrap.hidden=false;entries.forEach(([k,v])=>{const row=document.createElement('div');row.className='param-row';const key=document.createElement('div');key.className='param-key';const val=document.createElement('div');val.className='param-value';key.textContent=k;val.textContent=v;row.append(key,val);list.append(row)})}catch{wrap.hidden=true}}
function switchTab(name){const isCase=name==='case';$('#case-panel').classList.toggle('active',isCase);$('#url-panel').classList.toggle('active',!isCase);$('#case-tab').classList.toggle('active',isCase);$('#url-tab').classList.toggle('active',!isCase);$('#case-tab').setAttribute('aria-selected',isCase);$('#url-tab').setAttribute('aria-selected',!isCase);history.replaceState(null,'','#'+(isCase?'case-converter':'url-codec'))}
$('#case-tab').addEventListener('click',()=>switchTab('case'));$('#url-tab').addEventListener('click',()=>switchTab('url'));window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey){if(e.key.toLowerCase()==='u'){e.preventDefault();switchTab('url');urlInput.focus()}else if(e.key.toLowerCase()==='c'&&document.activeElement!==caseInput){e.preventDefault();switchTab('case');caseInput.focus()}}});if(location.hash==='#url-codec')switchTab('url');
})();
</script>
</body></html>
